<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Books | EduSwap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="page-nav">
    <a href="index.html"><h1>EduSwap</h1></a>
    <div class="nav-links">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="browse.html">Browse</a></li>
            <li><a href="sell.html">Sell</a></li>
        </ul>
    </div>
</nav>

<section class="sell-page">
    <div class="sell-card">
        <h1>Sell Your Book</h1>
        <p>Upload your textbook or notes and connect with students who need them.</p>

        <form class="sell-form">
            <input type="text" placeholder="Book Title" required>
            <input type="text" placeholder="Subject / Module" required>
            <input type="text" placeholder="Price (R)" required>
            <textarea placeholder="Condition / Description"></textarea>
            <input type="file">
            <button type="submit">Submit Listing</button>
        </form>
    </div>
</section>

<script>
document.querySelector(".sell-form").addEventListener("submit", function(e){
    e.preventDefault();
    alert("Book uploaded successfully!");
});
</script>

</body>
</html>
